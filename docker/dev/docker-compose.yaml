services:
  server:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: ${PROJECT}-server
    ports:
      - ${PORT}:${PORT}
    env_file:
      - ../../.env
    environment: # Replace value pass by ref variable
      MIKRO_ORM_HOST: ${DB_HOST}
      MIKRO_ORM_PORT: ${DB_PORT}
      MIKRO_ORM_DB_NAME: ${DB_NAME}
      MIKRO_ORM_USER: ${DB_USERNAME}
      MIKRO_ORM_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - redis-stack
    restart: always

  redis-stack:
    image: redis/redis-stack
    container_name: ${PROJECT}-redis
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - redis_data:/data
    restart: on-failure

  gateway:
    image: nginx:alpine
    container_name: ${PROJECT}-gateway
    ports:
      - "80:80"
    volumes:
      - ../../config.d/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../../config.d/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf

volumes:
  redis_data:
